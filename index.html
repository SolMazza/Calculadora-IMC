<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section>
            <h1>Calculadora IMC</h1>
            <p>vamos descobrir seu indíce de massa corporal</p>
            <label for="peso">Digite seu peso:</label>
            <input type="number" id="peso" placeholder="Ex: 62.5">

            <label for="altura">Digite sua altura:</label>
            <input type="number" id="altura" placeholder="Ex: 1.52">
            <button onclick="calcular()">Calcular IMC</button>
            <div id="resultado"></div>
        </section>
    </main>
    <script src="main.js"></script>
</body>

</html>
